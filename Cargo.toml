[package]
name = "huntql"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A pipe-based threat-hunting query language over Zeek logs, with beacon, stack, rare and first_seen operators"
license = "MIT"
readme = "README.md"
keywords = ["zeek", "threat-hunting", "query-language", "beaconing", "security"]
categories = ["command-line-utilities", "parser-implementations"]

[lib]
name = "huntql"
path = "src/lib.rs"

[[bin]]
name = "huntql"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
flate2 = "1.0"
log = "0.4"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
proptest = "1.5"

[profile.release]
debug = 1
